        body.innerHTML = '<div style="color:var(--text-2);font-size:12.5px">Loading weather…</div>';
        try {
          const geoRes = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
          );
          const geo = await geoRes.json();
          if (!geo.results || !geo.results.length) throw new Error(`No place found for “${city}”.`);
          const place = geo.results[0];

          const wxRes = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}` +
              '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code' +
              '&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1'
          );
          const wx = await wxRes.json();
          if (id !== request) return;

          const current = wx.current || {};
          const daily = wx.daily || {};
          const [label, emoji] = CODES[current.weather_code] || ['Unknown', '🌡️'];
          const placeName = [place.name, place.country].filter(Boolean).join(', ');

          body.innerHTML = `
            <div class="weather-hero">
              <div style="font-size:54px;line-height:1">${emoji}</div>
              <div>
                <div class="temp">${Math.round(current.temperature_2m)}°C</div>
                <div class="where">${escapeHTML(placeName)}</div>
                <div class="cond">${label}</div>
              </div>
            </div>
            <div class="weather-stats">
              <div class="stat"><span>Feels like</span><strong>${Math.round(current.apparent_temperature)}°C</strong></div>
              <div class="stat"><span>Humidity</span><strong>${Math.round(current.relative_humidity_2m)}%</strong></div>
              <div class="stat"><span>Wind</span><strong>${Math.round(current.wind_speed_10m)} km/h</strong></div>
              <div class="stat"><span>Today</span><strong>${Math.round(daily.temperature_2m_min?.[0])}° / ${Math.round(
            daily.temperature_2m_max?.[0]
          )}°</strong></div>
            </div>
            <div class="weather-note">Live data from Open-Meteo. This app needs a network connection; everything else on the desktop works offline.</div>`;
          win.setTitle(`Weather — ${placeName}`);
        } catch (err) {
          if (id !== request) return;
          body.innerHTML = `<div style="color:var(--text-2);font-size:12.5px;line-height:1.6">
            Could not load weather.<br>${escapeHTML(String(err.message || err))}
          </div>`;
        }
      }

      function escapeHTML(text) {
        return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      go.addEventListener('click', () => lookup(cityInput.value.trim() || 'London'));
      cityInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') lookup(cityInput.value.trim() || 'London');
      });

      lookup('London');
    },
  });

};

__defs['apps/taskmanager.js'] = function (__exports, __req) {
  // Task Manager — shows open windows and lets you end them, like the real thing.
  const { defineApp, getApp, listApps } = __req('registry.js');
  const { getWindows, onWindowsChange } = __req('wm.js');
  const { prefs } = __req('state.js');

  defineApp({
    id: 'taskmanager',
    name: 'Task Manager',
    icon: 'tasks',
    category: 'System',
    size: '0.4 MB',
    description: 'See every open window and end the ones you no longer need.',
    width: 620,
    height: 460,
    minWidth: 420,
    minHeight: 300,
    launch(win) {
      win.body.innerHTML = `
        <div style="display:flex;flex-direction:column;height:100%">
          <div class="store-top">
            <h2>Processes</h2>
            <span class="spacer" style="flex:1"></span>
            <span style="font-size:11.5px;color:var(--text-2)" data-el="count"></span>
          </div>
          <div style="flex:1;overflow:auto;padding:10px 14px" data-el="list"></div>
          <div class="statusbar">
            <span>Nimbus OS 1.0.0</span>
            <span data-el="apps"></span>
          </div>
        </div>`;

      const list = win.body.querySelector('[data-el="list"]');
      const count = win.body.querySelector('[data-el="count"]');
      const appsLabel = win.body.querySelector('[data-el="apps"]');

      function draw() {
        const windows = getWindows();
        count.textContent = `${windows.length} window${windows.length === 1 ? '' : 's'}`;
        appsLabel.textContent = `${listApps().length} apps registered · ${prefs.installed.length} installed from the store`;
        list.innerHTML = '';
        if (!windows.length) {
          list.innerHTML = '<div style="color:var(--text-2);font-size:12.5px;padding:16px 4px">No windows are open.</div>';
          return;
        }
        windows.forEach((w) => {
          const app = getApp(w.appId);
          const row = document.createElement('div');
          row.className = 'set-row';
          row.style.borderRadius = '6px';
          row.innerHTML = '<div class="label"></div><button type="button" class="btn ghost">End task</button>';
          const label = row.querySelector('.label');
          label.textContent = app ? app.name : w.appId;
          const small = document.createElement('small');
          small.textContent = w.title;
          label.appendChild(small);
          row.querySelector('button').addEventListener('click', () => w.close());
          list.appendChild(row);
        });
      }

      draw();
      win.onClose = onWindowsChange(draw);
    },
  });

};

__defs['shell.js'] = function (__exports, __req) {
  // Shell glue: desktop shortcuts, taskbar, Start menu, tray clock, theme toggle.
  const { iconSVG } = __req('icons.js');
  const { getApp, listApps } = __req('registry.js');
  const { prefs, savePrefs, isInstalled, onPrefsChange, applyAppearance } = __req('state.js');
  const { openApp, onWindowsChange, getWindows, getActiveId, findWindow } = __req('wm.js');

  const PINNED_TASKBAR = ['brave', 'store', 'notepad', 'settings'];

  const els = {};
  let startOpen = false;
  let allMode = false;

  function initShell() {
    els.screen = document.getElementById('screen');
    els.startButton = document.getElementById('start-button');
    els.menu = document.getElementById('startmenu');
    els.search = document.getElementById('start-search-input');
    els.pinned = document.getElementById('start-pinned');
    els.all = document.getElementById('start-all');
    els.pinnedHead = document.getElementById('start-pinned-head');
    els.allHead = document.getElementById('start-all-head');
    els.empty = document.getElementById('start-empty');
    els.desktop = document.getElementById('desktop-icons');
    els.taskbarApps = document.getElementById('taskbar-apps');
    els.recent = document.getElementById('start-recent');
    els.recentHead = document.getElementById('start-recent-head');

    applyAppearance();
    renderDesktop();
    renderStart();
    renderTaskbar(getWindows(), getActiveId());

    els.startButton.addEventListener('click', () => (startOpen ? closeStart() : openStart()));
    document.getElementById('tb-search').addEventListener('click', () => openStart());
    document.getElementById('start-recent-more').addEventListener('click', () => {
      allMode = true;
      renderStart();
    });
    document.getElementById('widgets').addEventListener('click', () => openApp('weather'));
    document.getElementById('show-desktop').addEventListener('click', () => {
      getWindows().forEach((win) => {
        if (!win.minimized) win.minimize();
      });
    });
    document.getElementById('start-all-toggle').addEventListener('click', () => {
      allMode = true;
      renderStart();
    });
    document.getElementById('start-all-back').addEventListener('click', () => {
      allMode = false;
      renderStart();
    });
    document.getElementById('start-all-toggle').addEventListener('dblclick', (e) => e.preventDefault());
    els.search.addEventListener('input', () => renderStart());

    document.getElementById('start-power').addEventListener('click', () => {
      closeStart();
      window.location.reload();
    });

    document.getElementById('tray-theme').addEventListener('click', () => {
      savePrefs({ theme: prefs.theme === 'dark' ? 'light' : 'dark' });
      applyAppearance();
    });
    document.getElementById('tray-clock').addEventListener('click', () => openApp('clock'));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && startOpen) {
        closeStart();
        els.startButton.focus();
      }
    });
    document.addEventListener('pointerdown', (e) => {
      if (!startOpen) return;
      if (e.target.closest('#startmenu') || e.target.closest('#start-button')) return;
      closeStart();
    });

    onWindowsChange((wins, activeId) => renderTaskbar(wins, activeId));
    onPrefsChange(() => {
      applyAppearance();
      renderDesktop();
      renderStart();
      renderTaskbar(getWindows(), getActiveId());
    });

    tickClock();
    setInterval(tickClock, 1000);
  }

  function renderDesktop() {
    els.desktop.innerHTML = '';
    prefs.desktop.forEach((id) => {
      const app = getApp(id);
      if (!app || !isInstalled(app)) return;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dicon';
      btn.title = app.description || app.name;
      btn.innerHTML = `${iconSVG(app.icon)}<span></span>`;
      btn.querySelector('span').textContent = app.name;
      btn.addEventListener('click', () => openApp(id));
      els.desktop.appendChild(btn);
    });
  }

  function renderTaskbar(windows = getWindows(), activeId = getActiveId()) {
    els.taskbarApps.innerHTML = '';
    const handled = new Set();
    PINNED_TASKBAR.forEach((id) => {
      const app = getApp(id);
      if (!app) return;
      handled.add(id);
      els.taskbarApps.appendChild(taskbarButton(app, windows.find((w) => w.appId === id), activeId));
    });
    windows.forEach((win) => {
      if (handled.has(win.appId)) return;
      const app = getApp(win.appId);
      if (!app) return;
      handled.add(win.appId);
      els.taskbarApps.appendChild(taskbarButton(app, win, activeId));
    });
  }

  function taskbarButton(app, win, activeId) {
    const btn = document.createElement('button');
    btn.type = 'button';
    const active = Boolean(win && win.id === activeId && !win.minimized);
    btn.className = `tb-btn${win ? ' running' : ''}${active ? ' active' : ''}`;
    btn.title = win ? win.title : app.name;
    btn.setAttribute('aria-label', app.name);
    btn.innerHTML = iconSVG(app.icon);
    btn.addEventListener('click', () => {
      const existing = findWindow(app.id);
      if (!existing) {
        openApp(app.id);
        return;
      }
      if (existing.minimized) existing.restore();
      else if (existing.id === activeId) existing.minimize();
      else existing.focus();
    });
    return btn;
  }

  function renderStart() {
    const q = els.search.value.trim().toLowerCase();
    let apps = listApps().filter(isInstalled).sort((a, b) => a.name.localeCompare(b.name));
    if (q) {
      apps = apps.filter((a) => `${a.name} ${a.description} ${a.category}`.toLowerCase().includes(q));
    }
    const showList = allMode || q.length > 0;

    els.pinned.hidden = showList;
    els.pinnedHead.hidden = showList;
    els.recent.hidden = showList;
    els.recentHead.hidden = showList;
    els.all.hidden = !showList;
    els.allHead.hidden = !showList;
    els.empty.hidden = apps.length > 0;
    els.pinned.innerHTML = '';
    els.all.innerHTML = '';
    els.recent.innerHTML = '';

    apps.forEach((app) => {
      els[showList ? 'all' : 'pinned'].appendChild(showList ? startRow(app) : startTile(app));
    });

    if (!showList) {
      ['notepad', 'calculator', 'settings', 'store']
        .map(getApp)
        .filter((app) => app && isInstalled(app))
        .slice(0, 4)
        .forEach((app) => els.recent.appendChild(recommendedRow(app)));
    }
  }

  function startTile(app) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'start-app';
    btn.title = app.description || app.name;
    btn.innerHTML = `${iconSVG(app.icon)}<span></span>`;
    btn.querySelector('span').textContent = app.name;
    btn.addEventListener('click', () => {
      closeStart();
      openApp(app.id);
    });
    return btn;
  }

  function startRow(app) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'start-row';
    btn.innerHTML = `${iconSVG(app.icon)}<span class="name"></span><small></small>`;
    btn.querySelector('.name').textContent = app.name;
    btn.querySelector('small').textContent = app.builtin ? 'Built in' : app.category;
    btn.addEventListener('click', () => {
      closeStart();
      openApp(app.id);
    });
    return btn;
  }

  function recommendedRow(app) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rec-item';
    btn.title = app.description || app.name;
    btn.innerHTML = `${iconSVG(app.icon)}<span class="rec-text"><strong></strong><small></small></span>`;
    btn.querySelector('strong').textContent = app.name;
    btn.querySelector('small').textContent = app.category;
    btn.addEventListener('click', () => {
      closeStart();
      openApp(app.id);
    });
    return btn;
  }

  function openStart() {
    startOpen = true;
    allMode = false;
    els.search.value = '';
    renderStart();
    els.menu.hidden = false;
    els.startButton.classList.add('open');
    requestAnimationFrame(() => els.search.focus());
  }

  function closeStart() {
    startOpen = false;
    els.menu.hidden = true;
    els.startButton.classList.remove('open');
  }

  function tickClock() {
    const now = new Date();
    const time = document.getElementById('clock-time');
    const date = document.getElementById('clock-date');
    if (!time || !date) return;
    time.textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    date.textContent = now.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  __exports.initShell = initShell;
};

__defs['tray.js'] = function (__exports, __req) {
  // Tray + Quick settings.
  //
  // Everything shown here comes from real browser APIs: navigator.onLine, the
  // Network Information API, Web Bluetooth, and the Battery Status API. A web
  // page cannot list or join Wi-Fi networks — that is the operating system's job —
  // so the network tile reports the true connection state and says plainly what it
  // cannot do, rather than drawing fake networks.
  const { prefs, savePrefs, applyAppearance, onPrefsChange } = __req('state.js');

  const conn =
    navigator.connection || navigator.mozConnection || navigator.webkitConnection || null;

  const state = {
    open: false,
    tab: 'network',
    bluetooth: 'checking', // checking | available | unavailable | blocked
    device: null,
    connected: false,
    note: '',
    battery: null,
  };

  const ICON = {
    wifi: '<svg viewBox="0 0 24 24" class="icon"><path d="M2.5 8.8a14 14 0 0 1 19 0M5.6 12.3a9.4 9.4 0 0 1 12.8 0M8.8 15.8a4.8 4.8 0 0 1 6.4 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="19.2" r="1.5" fill="currentColor"/></svg>',
    wifiOff: '<svg viewBox="0 0 24 24" class="icon"><path d="M2.5 8.8a14 14 0 0 1 8-3.7M13.6 5.1a14 14 0 0 1 7.9 3.7M5.6 12.3a9.4 9.4 0 0 1 4.3-2.2M14.2 10.2a9.4 9.4 0 0 1 4.2 2.1M8.8 15.8a4.8 4.8 0 0 1 6.4 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="19.2" r="1.5" fill="currentColor"/></svg>',
    bluetooth: '<svg viewBox="0 0 24 24" class="icon"><path d="M8 7.5 16 16.5 12 20V4l4 3.5L8 16.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    theme: '<svg viewBox="0 0 24 24" class="icon"><circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.7"/><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></g></svg>',
    battery: '<svg viewBox="0 0 24 24" class="icon"><rect x="2.5" y="7.5" width="16" height="9" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="20" y="10.2" width="2" height="3.6" rx="1" fill="currentColor"/><rect class="level" x="4.4" y="9.4" width="10" height="5.2" rx="1.1" fill="currentColor"/></svg>',
  };

  let root;
  let networkBtn;
  let bluetoothBtn;

  function initTray() {
    root = document.getElementById('quicksettings');
    networkBtn = document.getElementById('tray-network');
    bluetoothBtn = document.getElementById('tray-bluetooth');
    if (!root) return;

    networkBtn.addEventListener('click', () => toggle('network'));
    bluetoothBtn.addEventListener('click', () => toggle('bluetooth'));
    // The theme tray button is owned by shell.js; this only keeps the flyout's
    // labels in step with the change it makes.
    onPrefsChange(() => render());

    document.addEventListener('pointerdown', (e) => {
      if (!state.open) return;
      if (e.target.closest('#quicksettings') || e.target.closest('.tray')) return;
      close();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.open) close();
    });

    window.addEventListener('online', () => onNetworkChange('Network restored'));
    window.addEventListener('offline', () => onNetworkChange('Network lost'));
    if (conn) conn.addEventListener('change', () => onNetworkChange(''));

    detectBluetooth();
    detectBattery();
    render();
  }

  function onNetworkChange(note) {
    state.note = note;
    render();
  }

  function toggle(tab) {
    if (state.open && state.tab === tab) return close();
    state.tab = tab;
    state.open = true;
    root.hidden = false;
    render();
  }

  function close() {
    state.open = false;
    root.hidden = true;
    networkBtn.classList.remove('open');
    bluetoothBtn.classList.remove('open');
  }

  async function detectBluetooth() {
    if (!navigator.bluetooth) {
      state.bluetooth = 'unavailable';
      render();
      return;
    }
    try {
      // Only Chrome-family browsers expose this, and only in a secure context.
      const available = navigator.bluetooth.getAvailability
        ? await navigator.bluetooth.getAvailability()
        : true;
      state.bluetooth = available ? 'available' : 'blocked';
    } catch {
      state.bluetooth = 'available';
    }
    render();
  }

  async function detectBattery() {
    if (!navigator.getBattery) return;
    try {
      const battery = await navigator.getBattery();
      state.battery = battery;
      const update = () => render();
      battery.addEventListener('levelchange', update);
      battery.addEventListener('chargingchange', update);
      render();
    } catch {
      /* not supported */
    }
  }

  function networkFacts() {
    const online = navigator.onLine;
    const facts = [{ k: 'Status', v: online ? 'Connected' : 'Offline' }];
    if (conn) {
      if (conn.effectiveType) facts.push({ k: 'Connection type', v: labelForType(conn.effectiveType) });
      if (typeof conn.downlink === 'number') facts.push({ k: 'Downlink', v: `${conn.downlink} Mb/s (estimate)` });
      if (typeof conn.rtt === 'number') facts.push({ k: 'Round trip', v: `${conn.rtt} ms (estimate)` });
      if (typeof conn.saveData === 'boolean') facts.push({ k: 'Data saver', v: conn.saveData ? 'On' : 'Off' });
    }
    return { online, facts };
  }

  function labelForType(type) {
    return (
      { 'slow-2g': 'Very slow', '2g': 'Slow', '3g': 'Moderate', '4g': 'Fast' }[type] || type
    );
  }

  async function pickBluetoothDevice() {
    state.note = '';
    if (!navigator.bluetooth) return;
    try {
      const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
      state.device = device.name || device.id || 'Unnamed device';
      device.addEventListener('gattserverdisconnected', () => {
        state.connected = false;
        render();
      });
      try {
        await device.gatt.connect();
        state.connected = true;
        state.note = `Connected to ${state.device}`;
      } catch (err) {
        state.connected = false;
        state.note = `Selected ${state.device}, but it refused a GATT connection (${err.name}).`;
      }
    } catch (err) {
      if (err && err.name === 'NotFoundError') {
        state.note = 'No device chosen.';
      } else if (err && err.name === 'SecurityError') {
        state.note = 'Bluetooth needs an https page — try the GitHub Pages link.';
      } else {
        state.note = `Bluetooth: ${err && err.name ? err.name : 'request failed'}`;
      }
    }
    render();
  }

  function render() {
    if (!root) return;
    const online = navigator.onLine;
    const themeDark = prefs.theme === 'dark';

    // Tray glyphs reflect real state.
    networkBtn.innerHTML = online ? ICON.wifi : ICON.wifiOff;
    networkBtn.title = online
      ? `Network: connected${conn && conn.effectiveType ? ` (${labelForType(conn.effectiveType)})` : ''}`
      : 'Network: offline';
    networkBtn.classList.toggle('open', state.open && state.tab === 'network');
    networkBtn.classList.toggle('off', !online);

    bluetoothBtn.innerHTML = ICON.bluetooth;
    bluetoothBtn.classList.toggle('open', state.open && state.tab === 'bluetooth');
    bluetoothBtn.title =
      state.bluetooth === 'unavailable'
        ? 'Bluetooth: not exposed by this browser'
        : state.connected
          ? `Bluetooth: connected to ${state.device}`
          : 'Bluetooth: open quick settings';

    const batteryPct = state.battery ? Math.round(state.battery.level * 100) : null;

    const tiles = [
      tile('network', ICON[online ? 'wifi' : 'wifiOff'], online ? 'Wi-Fi' : 'Offline', networkSubtitle(), true),
      tile(
        'bluetooth',
        ICON.bluetooth,
        'Bluetooth',
        state.bluetooth === 'unavailable'
          ? 'Not available'
          : state.connected
            ? state.device
            : state.bluetooth === 'blocked'
              ? 'Turned off'
              : 'Add device',
        state.bluetooth !== 'unavailable',
      ),
      tile('theme', ICON.theme, 'Theme', themeDark ? 'Dark' : 'Light', true),
    ];
    if (batteryPct !== null) {
      tiles.push(
        tile(
          'battery',
          ICON.battery,
          'Battery',
          `${batteryPct}%${state.battery.charging ? ' · charging' : ''}`,
          false,
        ),
      );
    }

    root.innerHTML = `
      <div class="qs-head">
        <span>Quick settings</span>
        <button type="button" class="qs-close" data-qs="close" aria-label="Close">✕</button>
      </div>
      <div class="qs-grid">${tiles.join('')}</div>
      <div class="qs-detail">${detailHtml()}</div>
    `;

    root.querySelectorAll('[data-qs]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const what = btn.getAttribute('data-qs');
        if (what === 'close') return close();
        if (what === 'bluetooth-add') return pickBluetoothDevice();
        if (what === 'theme') {
          savePrefs({ theme: themeDark ? 'light' : 'dark' });
          applyAppearance();
          return render();
        }
        if (what === 'network' || what === 'bluetooth' || what === 'battery') {
          state.tab = what;
          return render();
        }
      });
    });
  }

  function tile(tab, icon, title, subtitle, interactive) {
    const active = state.tab === tab;
    return `<button type="button" class="qs-tile${active ? ' active' : ''}${interactive ? '' : ' passive'}"
      data-qs="${interactive ? tab : tab}" title="${escapeHtml(subtitle)}">
      <span class="qs-icon">${icon}</span>
      <span class="qs-text"><strong>${escapeHtml(title)}</strong><small>${escapeHtml(subtitle)}</small></span>
    </button>`;
  }

  function networkSubtitle() {
    if (!navigator.onLine) return 'No connection';
